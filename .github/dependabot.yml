version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 10
    ignore:
      # These upgrades require coordinated toolchain/runtime migrations rather
      # than isolated package bumps.
      - dependency-name: '@babel/core'
        update-types:
          - version-update:semver-major
      - dependency-name: '@babel/preset-env'
        update-types:
          - version-update:semver-major
      - dependency-name: '@babel/preset-react'
        update-types:
          - version-update:semver-major
      - dependency-name: '@babel/preset-typescript'
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/node-hid'
        update-types:
          - version-update:semver-major
      - dependency-name: '@ethereumjs/common'
        update-types:
          - version-update:semver-major
      - dependency-name: '@ethereumjs/tx'
        update-types:
          - version-update:semver-major
      - dependency-name: '@ethereumjs/util'
        update-types:
          - version-update:semver-major
      - dependency-name: '@eslint/js'
        update-types:
          - version-update:semver-major
      - dependency-name: '@metamask/eth-sig-util'
        update-types:
          - version-update:semver-major
      - dependency-name: '@scure/bip32'
        update-types:
          - version-update:semver-major
      - dependency-name: conf
        update-types:
          - version-update:semver-major
      - dependency-name: electron
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: hotkeys-js
        update-types:
          - version-update:semver-major
      - dependency-name: lint-staged
        update-types:
          - version-update:semver-major
        # 13.3.0 accidentally shipped v14 code and a vulnerable micromatch.
        versions:
          - 13.3.0
      - dependency-name: node-hid
        update-types:
          - version-update:semver-major
      - dependency-name: query-string
        update-types:
          - version-update:semver-major
      # tar-stream 3.2.1 exposes StreamX types that are incompatible with the
      # Node stream bridge used by the bounded dapp archive extractor.
      - dependency-name: tar-stream
        versions:
          - 3.2.1
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: uuid
        update-types:
          - version-update:semver-major
    groups:
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-patches:
        dependency-type: production
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Taipei
    groups:
      actions:
        patterns:
          - '*'
