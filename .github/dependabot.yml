version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 10
    ignore:
      # These upgrades require coordinated toolchain/runtime migrations rather
      # than isolated package bumps.
      - dependency-name: '@babel/preset-env'
        update-types:
          - version-update:semver-major
      - dependency-name: '@babel/preset-react'
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      - dependency-name: query-string
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-patches:
        dependency-type: production
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Taipei
    groups:
      actions:
        patterns:
          - '*'
