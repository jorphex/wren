name: Build a draft Linux release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag; defaults to v<package version>
        required: false
        type: string

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: linux-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install --global npm@11.12.0
      - name: Resolve release metadata
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          version=$(node --print "require('./package.json').version")
          expected_tag="v${version}"
          tag="${EVENT_TAG:-${REQUESTED_TAG:-$expected_tag}}"
          if [[ "$tag" != "$expected_tag" ]]; then
            echo "Release tag must exactly match package version: $expected_tag" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev
      - run: npm run setup:ci
      - run: npm run audit:release
      - run: npm run format:check
      - run: npm run lint
      - run: npm run compile
      - run: npm test
      - run: npm run test:usbAdapters
      - run: npm run bundle
      - run: npm run package:linux:x64
      - run: npm run package:verify:linux
      - name: Generate CycloneDX SBOM
        run: npm run sbom:linux
      - name: Verify production SBOM
        run: npm run sbom:verify:linux
      - name: Finalize and verify release checksums
        run: |
          npm run checksums:linux
          npm run release:verify:linux
      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.AppImage
            dist/*_amd64.deb
      - name: Attest package SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.AppImage
            dist/*_amd64.deb
          sbom-path: dist/wren.cdx.json
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          remote_tag=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          tag_commit=$(printf '%s\n' "$remote_tag" | awk '/\^\{\}$/ { print $1; found=1 } END { if (!found && NR == 1) print first } NR == 1 { first=$1 }')
          if [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Refusing release: $RELEASE_TAG points to $tag_commit, not $GITHUB_SHA" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to modify existing release $RELEASE_TAG; delete a failed draft or use a new version" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*.AppImage dist/*_amd64.deb dist/SHA256SUMS dist/wren.cdx.json --target "$GITHUB_SHA" --draft --title "$RELEASE_VERSION" --notes "Automated Linux draft build from $GITHUB_SHA."
