<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Wren Earn — Yearn attribution studies</title>
    <link rel="stylesheet" href="file:///home/j/projects/wren/bundle/dash.bf1b3ada.css" />
    <link rel="stylesheet" href="file:///home/j/projects/wren/bundle/dash.ca4bd4c6.css" />
    <style>
      html,
      body {
        width: 620px;
        min-height: 900px;
        margin: 0;
        overflow: hidden;
        background: #090d0c;
      }

      .preview {
        width: 620px;
        height: 900px;
        overflow: hidden;
        background: var(--wren-bg-canvas);
      }

      .earnProviderWordmark {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        min-height: 24px;
      }

      .earnProviderWordmark span {
        color: rgba(232, 237, 233, 0.58);
      }

      .earnProviderWordmark img {
        display: block;
        width: 85px;
        height: auto;
        opacity: 0.9;
      }

    </style>
  </head>
  <body class="dark variant-wordmark">
    <main class="preview">
      <div class="earn">
        <header class="earnHero">
          <div id="provider"></div>
          <h1>Earn</h1>
          <p id="description"></p>
          <button class="earnRefresh wrenControl wrenControlSecondary wrenControlCompact">Refresh</button>
        </header>
        <div class="earnAccount"><span>Account</span><strong>Workshop</strong><em>Read only</em></div>
        <div class="earnTabs">
          <button class="wrenControl wrenControlGhost wrenControlCompact earnTabActive">All</button>
          <button class="wrenControl wrenControlGhost wrenControlCompact">Ethereum</button>
          <button class="wrenControl wrenControlGhost wrenControlCompact">Base</button>
          <button class="wrenControl wrenControlGhost wrenControlCompact">Katana</button>
        </div>
        <section class="earnChain">
          <div class="earnChainHeading">
            <h2>Ethereum</h2>
            <span>2 curated vaults</span>
          </div>
          <div class="earnVaultList">
            <button class="earnVault">
              <div class="earnVaultTop">
                <div class="earnVaultIdentity">
                  <span class="earnVaultArtwork earnVaultArtwork-card earnVaultArtwork-ethereum-yvusd"
                    ><span>yvU</span></span
                  >
                  <div>
                    <div class="earnVaultName">yvUSD</div>
                    <div class="earnVaultAsset">USDC · Ethereum</div>
                  </div>
                </div>
                <div class="earnApy"><strong>7.42%</strong><span>Estimated APY</span></div>
              </div>
              <div class="earnVaultMetrics"><span>$43.2m TVL</span><span>Medium risk</span></div>
            </button>
            <button class="earnVault">
              <div class="earnVaultTop">
                <div class="earnVaultIdentity">
                  <span class="earnVaultArtwork earnVaultArtwork-card earnVaultArtwork-ethereum-ybold"
                    ><span>yBO</span></span
                  >
                  <div>
                    <div class="earnVaultName">Staked yBOLD</div>
                    <div class="earnVaultAsset">BOLD · Ethereum</div>
                  </div>
                </div>
                <div class="earnApy"><strong>5.18%</strong><span>Estimated APY</span></div>
              </div>
              <div class="earnVaultMetrics"><span>$18.7m TVL</span><span>Medium risk</span></div>
            </button>
          </div>
        </section>
      </div>
    </main>
    <script>
      const provider = document.getElementById('provider')
      const description = document.getElementById('description')
      document.body.className = 'dark variant-wordmark'
      provider.className = 'earnEyebrow earnProviderWordmark'
      provider.innerHTML = '<span>Vaults by</span><img src="yearn-logo-white.svg" alt="Yearn" />'
      description.textContent = 'A focused selection of established vaults, separated by chain.'
    </script>
  </body>
</html>
